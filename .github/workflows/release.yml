name: Verify and Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21.0.12+8.0.LTS

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify Android project
        run: >
          ./gradlew --no-daemon --no-configuration-cache
          clean test lint assembleDebug assembleRelease

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked release tooling
        run: npm ci --ignore-scripts

      - name: Audit release tooling
        run: npm run audit:release

      - name: Verify release tooling
        run: npm run test:release

  release:
    name: Publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release controls
        run: scripts/verify-release-preconditions.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLYVANTA_RELEASE_STORE_BASE64: ${{ secrets.PLYVANTA_RELEASE_STORE_BASE64 }}
          PLYVANTA_RELEASE_STORE_PASSWORD: ${{ secrets.PLYVANTA_RELEASE_STORE_PASSWORD }}
          PLYVANTA_RELEASE_KEY_ALIAS: ${{ secrets.PLYVANTA_RELEASE_KEY_ALIAS }}
          PLYVANTA_RELEASE_KEY_PASSWORD: ${{ secrets.PLYVANTA_RELEASE_KEY_PASSWORD }}

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21.0.12+8.0.LTS

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked release tooling
        run: npm ci --ignore-scripts

      - name: Build, sign, and publish the semantic release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLYVANTA_RELEASE_STORE_BASE64: ${{ secrets.PLYVANTA_RELEASE_STORE_BASE64 }}
          PLYVANTA_RELEASE_STORE_PASSWORD: ${{ secrets.PLYVANTA_RELEASE_STORE_PASSWORD }}
          PLYVANTA_RELEASE_KEY_ALIAS: ${{ secrets.PLYVANTA_RELEASE_KEY_ALIAS }}
          PLYVANTA_RELEASE_KEY_PASSWORD: ${{ secrets.PLYVANTA_RELEASE_KEY_PASSWORD }}

      - name: Verify any release for this commit
        if: always()
        run: scripts/verify-current-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
